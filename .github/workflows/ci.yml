name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: node dist/cli/index.js install-browser --with-deps
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: node dist/cli/index.js install-browser
      - name: Run the strict test suite
        # CI'da 0.1 kurulumu yok; sürümler arası testler bilerek atlanır.
        # Katı kipte atlama normalde hatadır, bu bayrak ona açık izindir.
        env:
          KOBAY_01_DIST: skip
        run: npm run test:strict
      - if: runner.os != 'Windows'
        run: npm run duman

  windows-duman:
    name: Windows smoke test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Restore Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run build
      - name: Smoke test
        # Adım tavanı job tavanından (15 dk) kısa: asılma olursa bu adım net düşsün.
        # Kurulum + Chromium indirme + keşif normalde birkaç dakika sürer.
        timeout-minutes: 10
        run: npm run duman
        shell: bash
